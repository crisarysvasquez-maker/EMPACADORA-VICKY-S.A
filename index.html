<!-- SECCIÓN REALIZA TU PEDIDO -->
    <section id="catalogo" class="seccion-catalogo">
        <h2 class="titulo-seccion">Realiza tu Pedido</h2>
        
        <div class="grid-catalogo">
            <!-- Producto 1: Leche de Coco (Usa tu foto individual del empaque, por ejemplo 'empaque-vicky.png') -->
            <div class="tarjeta-producto">
                <div class="contenedor-imagen-producto">
                    <img src="empaque-vicky.png" alt="Leche de Coco (1 Lb)" class="img-producto-catalogo">
                </div>
                <div class="info-producto">
                    <h3>Leche de Coco (1 Lb)</h3>
                    <p>Congelada, 100% natural.</p>
                    <span class="precio">$1.25</span>
                    <div class="control-cantidad">
                        <button class="btn-restar">-</button>
                        <input type="text" value="1" readonly>
                        <button class="btn-sumar">+</button>
                    </div>
                    <button class="btn-anadir">Añadir al carrito</button>
                </div>
            </div>

            <!-- Producto 2: Coco Rallado -->
            <div class="tarjeta-producto">
                <div class="contenedor-imagen-producto">
                    <img src="coco-rallado.png" alt="Coco Rallado (1 Lb)" class="img-producto-catalogo">
                </div>
                <div class="info-producto">
                    <h3>Coco Rallado (1 Lb)</h3>
                    <p>Prensado al frío.</p>
                    <span class="precio">$1.25</span>
                    <div class="control-cantidad">
                        <button class="btn-restar">-</button>
                        <input type="text" value="1" readonly>
                        <button class="btn-sumar">+</button>
                    </div>
                    <button class="btn-anadir">Añadir al carrito</button>
                </div>
            </div>
        </div>
    </section>
